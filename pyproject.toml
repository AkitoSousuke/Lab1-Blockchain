[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab01-blockchain"
version = "0.1.0"
description = "Python scaffold for the Lab 01 blockchain simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blockchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
